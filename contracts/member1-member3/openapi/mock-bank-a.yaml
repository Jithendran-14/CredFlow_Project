{
  "openapi": "3.0.3",
  "info": {
    "title": "CredFlow Bank A Simulator API",
    "version": "1.1.0",
    "description": "Member 3 private Bank A and NBFC B simulators, using distinct lender wire formats and independent processes and isolated Oracle schemas. The canonical paths below are used by Integration. Java also accepts applications/cases aliases under each bank prefix; clients should use the documented canonical lender routes. No real lender or frontend is included. Callbacks are delivered to Integration using each lender callback client and stable eventId/sequence. Aligned to the two upstream contracts dated 2026-10-16. Validate the configured Member 1 RS256 issuer, audience, expiry and nonblank subject against an explicitly configured JWKS or public RSA key. Default FLAT mode reads roles (or role) and trusted camelCase sellerId/marketplaceId/lenderId; KEYCLOAK mode is opt-in. SELLER ownership uses trusted sellerId when stored, with legacy subject fallback only for older workflows without it. MARKETPLACE is a scoped alias for MARKETPLACE_OPERATIONS. Auth currently does not provision lender officers or machine clients. Internal endpoints still require designated client identity and narrow scopes; ADMIN cannot bypass them. See docs/team-contract-alignment.md. The Member 2 verification identity module and financial-data provider endpoint are upstream proposed modules and are not implemented by these lender paths. The identity and financial-provider calls belong to Consent and Verification, never Orchestration or Eligibility directly."
  },
  "servers": [
    {
      "url": "http://localhost:8091"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/mock/lenders/bank-a/applications": {
      "post": {
        "operationId": "bankASubmit",
        "summary": "Submit a Bank A application",
        "description": "Private Integration system client only: configured credflow.simulator.integration-client-id (integration-service by default), plus lender.submit scope. The lender reference is unique inside this lender schema. Same reference and identical business payload returns the original receipt; changed content returns 409. A cancellation tombstone prevents later creation. This endpoint returns 200, including first submission.",
        "parameters": [
          {
            "$ref": "#/components/parameters/CorrelationId"
          }
        ],
        "responses": {
          "200": {
            "description": "Success; an idempotent replay returns the original response.",
            "headers": {
              "X-Correlation-ID": {
                "description": "Trace ID for this request.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BankAReceipt"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "409": {
            "$ref": "#/components/responses/Error409"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/BankASubmission"
              }
            }
          }
        }
      }
    },
    "/mock/lenders/bank-a/applications/by-reference/{reference}": {
      "get": {
        "operationId": "bankALookup",
        "summary": "Look up Bank A by submission reference",
        "description": "Private Integration system client only: configured credflow.simulator.integration-client-id (integration-service by default), plus lender.lookup scope. A committed application returns its original receipt; definitive absence or a cancellation tombstone returns 404. Integration must perform this lookup after an uncertain create timeout before another create attempt.",
        "parameters": [
          {
            "name": "reference",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "$ref": "#/components/parameters/CorrelationId"
          }
        ],
        "responses": {
          "200": {
            "description": "Success; an idempotent replay returns the original response.",
            "headers": {
              "X-Correlation-ID": {
                "description": "Trace ID for this request.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BankAReceipt"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "409": {
            "$ref": "#/components/responses/Error409"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        }
      }
    },
    "/mock/lenders/bank-a/applications/by-reference/{reference}/cancellation": {
      "post": {
        "operationId": "bankACancelReference",
        "summary": "Cancel Bank A by reference",
        "description": "Private Integration system client only: configured credflow.simulator.integration-client-id (integration-service by default), plus lender.command scope. Creates a durable cancellation tombstone even when submission has not arrived, preventing a late create. An existing nonterminal application emits a stable cancellation callback. Repeated cancellation is safe; accepted/declined/rejected applications conflict.",
        "parameters": [
          {
            "name": "reference",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "$ref": "#/components/parameters/CorrelationId"
          }
        ],
        "responses": {
          "200": {
            "description": "Success; an idempotent replay returns the original response.",
            "headers": {
              "X-Correlation-ID": {
                "description": "Trace ID for this request.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ReferenceCancelled"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "409": {
            "$ref": "#/components/responses/Error409"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        },
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ReferenceCancellation"
              }
            }
          }
        }
      }
    },
    "/mock/lenders/bank-a/applications/{externalId}": {
      "get": {
        "operationId": "bankADetails",
        "summary": "Read Bank A persisted state",
        "description": "Private Integration system client only: configured credflow.simulator.integration-client-id (integration-service by default), plus lender.lookup scope. externalId is the bankApplicationId or caseId returned in its receipt. State is private test-system data.",
        "parameters": [
          {
            "name": "externalId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "$ref": "#/components/parameters/CorrelationId"
          }
        ],
        "responses": {
          "200": {
            "description": "Success; an idempotent replay returns the original response.",
            "headers": {
              "X-Correlation-ID": {
                "description": "Trace ID for this request.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SimulatorState"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "409": {
            "$ref": "#/components/responses/Error409"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        }
      }
    },
    "/mock/lenders/bank-a/applications/{externalId}/commands/{commandId}": {
      "post": {
        "operationId": "bankACommand",
        "summary": "Apply a Bank A command",
        "description": "Private Integration system client only: configured credflow.simulator.integration-client-id (integration-service by default), plus lender.command scope. Commands persist state changes and callbacks atomically. Same commandId and identical payload returns the prior acknowledgement; changed payload returns 409. terminal applications reject new business commands. Nested approved offers are fully validated before a decision is recorded. Answers cannot reset an already available offer.",
        "parameters": [
          {
            "name": "externalId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "commandId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "$ref": "#/components/parameters/CorrelationId"
          }
        ],
        "responses": {
          "202": {
            "description": "Accepted for durable asynchronous processing.",
            "headers": {
              "X-Correlation-ID": {
                "description": "Trace ID for this request.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SimulatorCommandAccepted"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "409": {
            "$ref": "#/components/responses/Error409"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SimulatorCommand"
              }
            }
          }
        }
      }
    },
    "/mock/lenders/bank-a/callbacks/{eventId}/replay": {
      "post": {
        "operationId": "bankAReplayCallback",
        "summary": "Replay a dead Bank A callback",
        "description": "Private Integration system client only: configured credflow.simulator.integration-client-id (integration-service by default), plus ops.replay scope. This endpoint requires the Integration system client rather than a human ADMIN. Only DEAD callbacks belonging to this bank may be replayed. It preserves eventId, sequence, payload, original trace and causation. Returns 200.",
        "parameters": [
          {
            "name": "eventId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "$ref": "#/components/parameters/CorrelationId"
          }
        ],
        "responses": {
          "200": {
            "description": "Success; an idempotent replay returns the original response.",
            "headers": {
              "X-Correlation-ID": {
                "description": "Trace ID for this request.",
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SimulatorCallbackReplay"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error400"
          },
          "401": {
            "$ref": "#/components/responses/Error401"
          },
          "403": {
            "$ref": "#/components/responses/Error403"
          },
          "404": {
            "$ref": "#/components/responses/Error404"
          },
          "409": {
            "$ref": "#/components/responses/Error409"
          },
          "503": {
            "$ref": "#/components/responses/Error503"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Validate the configured Member 1 RS256 issuer, audience, expiry and nonblank subject against an explicitly configured JWKS or public RSA key. Default FLAT mode reads roles (or role) and trusted camelCase sellerId/marketplaceId/lenderId; KEYCLOAK mode is opt-in. SELLER ownership uses trusted sellerId when stored, with legacy subject fallback only for older workflows without it. MARKETPLACE is a scoped alias for MARKETPLACE_OPERATIONS. Auth currently does not provision lender officers or machine clients. Internal endpoints still require designated client identity and narrow scopes; ADMIN cannot bypass them. See docs/team-contract-alignment.md."
      }
    },
    "schemas": {
      "Actor": {
        "type": "object",
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "HUMAN",
              "SYSTEM_CLIENT"
            ]
          },
          "subject": {
            "type": "string",
            "minLength": 1
          },
          "organisationId": {
            "type": "string",
            "nullable": true
          }
        },
        "required": [
          "type",
          "subject"
        ]
      },
      "Error": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "correlationId": {
            "type": "string"
          },
          "fieldErrors": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "field": {
                  "type": "string"
                },
                "message": {
                  "type": "string"
                }
              },
              "required": [
                "field",
                "message"
              ]
            }
          }
        },
        "required": [
          "code",
          "message",
          "correlationId",
          "fieldErrors"
        ]
      },
      "Question": {
        "type": "object",
        "properties": {
          "questionId": {
            "type": "string",
            "minLength": 1
          },
          "prompt": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1000
          }
        },
        "required": [
          "questionId",
          "prompt"
        ]
      },
      "Answer": {
        "type": "object",
        "properties": {
          "questionId": {
            "type": "string",
            "minLength": 1
          },
          "answerText": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4000
          }
        },
        "required": [
          "questionId",
          "answerText"
        ],
        "additionalProperties": false
      },
      "OfferTerms": {
        "type": "object",
        "properties": {
          "offerId": {
            "type": "string",
            "format": "uuid"
          },
          "offeredAmount": {
            "type": "string",
            "pattern": "^[0-9]{1,17}\\.[0-9]{2}$",
            "example": "100000.00",
            "description": "Decimal string with exactly two fractional digits; positive for requested/offered amounts and nonnegative for fees."
          },
          "currency": {
            "type": "string",
            "enum": [
              "INR"
            ]
          },
          "annualInterestRatePercent": {
            "type": "string",
            "pattern": "^[0-9]{1,3}(\\.[0-9]{1,4})?$",
            "description": "Decimal string in the inclusive range 0..100."
          },
          "interestRateType": {
            "type": "string",
            "enum": [
              "FIXED"
            ]
          },
          "tenureMonths": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 120
          },
          "repaymentFrequency": {
            "type": "string",
            "enum": [
              "MONTHLY"
            ]
          },
          "feesAmount": {
            "type": "string",
            "pattern": "^[0-9]{1,17}\\.[0-9]{2}$",
            "example": "100000.00",
            "description": "Decimal string with exactly two fractional digits; positive for requested/offered amounts and nonnegative for fees."
          },
          "termsReference": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time",
            "description": "Must be in the future when a new command is first persisted; replay retains the original request."
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "maximum": 0
          }
        },
        "required": [
          "offerId",
          "offeredAmount",
          "currency",
          "annualInterestRatePercent",
          "interestRateType",
          "tenureMonths",
          "repaymentFrequency",
          "feesAmount",
          "termsReference",
          "expiresAt"
        ]
      },
      "DecisionCommand": {
        "type": "object",
        "properties": {
          "decisionId": {
            "type": "string",
            "format": "uuid"
          },
          "decision": {
            "type": "string",
            "enum": [
              "APPROVED",
              "REJECTED",
              "MANUAL_REVIEW",
              "ACTION_REQUIRED"
            ]
          },
          "reasonCode": {
            "type": "string",
            "minLength": 1,
            "description": "Required for REJECTED."
          },
          "informationRequestId": {
            "type": "string",
            "format": "uuid",
            "description": "Required for ACTION_REQUIRED."
          },
          "questions": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Question"
            },
            "minItems": 1,
            "maxItems": 50,
            "description": "Required for ACTION_REQUIRED; unique questionId values."
          },
          "offer": {
            "$ref": "#/components/schemas/OfferTerms"
          },
          "decidedAt": {
            "type": "string",
            "format": "date-time",
            "description": "Integration stamps this once when accepting an officer command; trusted simulator commands and callbacks preserve it."
          },
          "originActor": {
            "$ref": "#/components/schemas/Actor"
          },
          "correlationId": {
            "type": "string",
            "maxLength": 100
          },
          "causationId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "decisionId",
          "decision"
        ],
        "description": "offer is allowed only for APPROVED. ACTION_REQUIRED requires informationRequestId and questions; REJECTED requires reasonCode."
      },
      "InformationRequestCommand": {
        "type": "object",
        "properties": {
          "informationRequestId": {
            "type": "string",
            "format": "uuid"
          },
          "questions": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Question"
            },
            "minItems": 1,
            "maxItems": 50
          },
          "originActor": {
            "$ref": "#/components/schemas/Actor"
          },
          "correlationId": {
            "type": "string",
            "maxLength": 100
          },
          "causationId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "informationRequestId",
          "questions"
        ]
      },
      "AnswerInformationCommand": {
        "type": "object",
        "properties": {
          "informationRequestId": {
            "type": "string",
            "format": "uuid"
          },
          "answers": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Answer"
            },
            "minItems": 1,
            "maxItems": 50
          },
          "syntheticDocumentReferences": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^synthetic://[A-Za-z0-9_./-]{1,200}$"
            }
          },
          "originActor": {
            "$ref": "#/components/schemas/Actor"
          },
          "correlationId": {
            "type": "string",
            "maxLength": 100
          },
          "causationId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "informationRequestId",
          "answers"
        ]
      },
      "AcceptOfferCommand": {
        "type": "object",
        "properties": {
          "offerId": {
            "type": "string",
            "format": "uuid"
          },
          "acceptanceId": {
            "type": "string",
            "format": "uuid"
          },
          "expectedOfferVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "acceptedAt": {
            "type": "string",
            "format": "date-time",
            "description": "Locally committed acceptance time; at most 60 seconds in the future."
          },
          "originActor": {
            "$ref": "#/components/schemas/Actor"
          },
          "correlationId": {
            "type": "string",
            "maxLength": 100
          },
          "causationId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "offerId",
          "acceptanceId",
          "expectedOfferVersion",
          "acceptedAt"
        ]
      },
      "DeclineOfferCommand": {
        "type": "object",
        "properties": {
          "offerId": {
            "type": "string",
            "format": "uuid"
          },
          "declineId": {
            "type": "string",
            "format": "uuid"
          },
          "operationAt": {
            "type": "string",
            "format": "date-time"
          },
          "originActor": {
            "$ref": "#/components/schemas/Actor"
          },
          "correlationId": {
            "type": "string",
            "maxLength": 100
          },
          "causationId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "offerId"
        ]
      },
      "WithdrawOfferCommand": {
        "type": "object",
        "properties": {
          "offerId": {
            "type": "string",
            "format": "uuid"
          },
          "reasonCode": {
            "type": "string"
          },
          "originActor": {
            "$ref": "#/components/schemas/Actor"
          },
          "correlationId": {
            "type": "string",
            "maxLength": 100
          },
          "causationId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "offerId"
        ]
      },
      "CancellationCommand": {
        "type": "object",
        "properties": {
          "cancellationId": {
            "type": "string",
            "format": "uuid"
          },
          "applicationId": {
            "type": "string",
            "format": "uuid",
            "description": "Required when cancellation arrives before a submission reservation."
          },
          "submissionId": {
            "type": "string",
            "format": "uuid"
          },
          "applicationRevision": {
            "type": "integer",
            "format": "int64",
            "minimum": 1
          },
          "lenderId": {
            "type": "string",
            "format": "uuid"
          },
          "reason": {
            "type": "string"
          },
          "originActor": {
            "$ref": "#/components/schemas/Actor"
          },
          "correlationId": {
            "type": "string",
            "maxLength": 100
          },
          "causationId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "cancellationId"
        ]
      },
      "CommandAccepted": {
        "type": "object",
        "properties": {
          "submissionId": {
            "type": "string",
            "format": "uuid"
          },
          "operationId": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "QUEUED"
            ]
          }
        },
        "required": [
          "submissionId",
          "operationId",
          "status"
        ]
      },
      "CallbackAccepted": {
        "type": "object",
        "properties": {
          "eventId": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "PENDING"
            ]
          }
        },
        "required": [
          "eventId",
          "status"
        ]
      },
      "OfferAcknowledgement": {
        "type": "object",
        "properties": {
          "offerId": {
            "type": "string",
            "format": "uuid"
          },
          "acceptanceId": {
            "type": "string",
            "format": "uuid"
          },
          "lenderAcknowledgementStatus": {
