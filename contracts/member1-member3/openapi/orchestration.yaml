  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Validate the configured Member 1 RS256 issuer, audience, expiry and nonblank subject against an explicitly configured JWKS or public RSA key. Default FLAT mode reads roles (or role) and trusted camelCase sellerId/marketplaceId/lenderId; KEYCLOAK mode is opt-in. SELLER ownership uses trusted sellerId when stored, with legacy subject fallback only for older workflows without it. MARKETPLACE is a scoped alias for MARKETPLACE_OPERATIONS. Auth currently does not provision lender officers or machine clients. Internal endpoints still require designated client identity and narrow scopes; ADMIN cannot bypass them. See docs/team-contract-alignment.md."
      }
    },
    "schemas": {
