{
  "openapi": "3.0.3",
  "info": {
    "title": "CredFlow Lender Integration API",
    "version": "1.0.1",
    "description": "Member 3 durable lender dispatch, adapters, officer commands and authenticated callbacks. All mutable requests are persisted before asynchronous delivery. The configured Integration audience is required; Gateway should expose only the officer routes to authorized lender officers, never private service or operational routes. Aligned to the two upstream contracts dated 2026-10-16. Validate the configured Member 1 RS256 issuer, audience, expiry and nonblank subject against an explicitly configured JWKS or public RSA key. Default FLAT mode reads roles (or role) and trusted camelCase sellerId/marketplaceId/lenderId; KEYCLOAK mode is opt-in. SELLER ownership uses trusted sellerId when stored, with legacy subject fallback only for older workflows without it. MARKETPLACE is a scoped alias for MARKETPLACE_OPERATIONS. Auth currently does not provision lender officers or machine clients. Internal endpoints still require designated client identity and narrow scopes; ADMIN cannot bypass them. See docs/team-contract-alignment.md."
  },
  "servers": [
    {
      "url": "http://localhost:8087",
      "description": "Direct service address; expose public routes through Member 1 Gateway after route configuration."
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
