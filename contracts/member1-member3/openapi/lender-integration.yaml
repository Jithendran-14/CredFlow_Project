          "causationId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "informationRequestId",
          "answers"
        ]
      },
      "AcceptOfferCommand": {
        "type": "object",
        "properties": {
          "offerId": {
            "type": "string",
            "format": "uuid"
          },
          "acceptanceId": {
            "type": "string",
            "format": "uuid"
          },
          "expectedOfferVersion": {
            "type": "integer",
            "format": "int64",
            "minimum": 0
          },
          "acceptedAt": {
            "type": "string",
            "format": "date-time",
            "description": "Locally committed acceptance time; at most 60 seconds in the future."
          },
          "originActor": {
            "$ref": "#/components/schemas/Actor"
          },
          "correlationId": {
            "type": "string",
            "maxLength": 100
          },
          "causationId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "offerId",
          "acceptanceId",
          "expectedOfferVersion",
          "acceptedAt"
        ]
      },
      "DeclineOfferCommand": {
        "type": "object",
        "properties": {
          "offerId": {
            "type": "string",
            "format": "uuid"
          },
          "declineId": {
            "type": "string",
            "format": "uuid"
          },
          "operationAt": {
            "type": "string",
            "format": "date-time"
          },
          "originActor": {
            "$ref": "#/components/schemas/Actor"
          },
          "correlationId": {
            "type": "string",
            "maxLength": 100
          },
          "causationId": {
            "type": "string",
            "format": "uuid"
          }
