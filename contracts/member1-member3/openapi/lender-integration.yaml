  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Validate the configured Member 1 RS256 issuer, audience, expiry and nonblank subject against an explicitly configured JWKS or public RSA key. Default FLAT mode reads roles (or role) and trusted camelCase sellerId/marketplaceId/lenderId; KEYCLOAK mode is opt-in. SELLER ownership uses trusted sellerId when stored, with legacy subject fallback only for older workflows without it. MARKETPLACE is a scoped alias for MARKETPLACE_OPERATIONS. Auth currently does not provision lender officers or machine clients. Internal endpoints still require designated client identity and narrow scopes; ADMIN cannot bypass them. See docs/team-contract-alignment.md."
      }
    },
    "schemas": {
      "Actor": {
        "type": "object",
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "HUMAN",
              "SYSTEM_CLIENT"
            ]
          },
          "subject": {
            "type": "string",
            "minLength": 1
          },
          "organisationId": {
            "type": "string",
            "nullable": true
          }
        },
        "required": [
          "type",
          "subject"
        ]
      },
      "Error": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "correlationId": {
            "type": "string"
          },
          "fieldErrors": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "field": {
                  "type": "string"
                },
                "message": {
                  "type": "string"
                }
              },
              "required": [
                "field",
                "message"
              ]
            }
          }
        },
        "required": [
          "code",
          "message",
          "correlationId",
          "fieldErrors"
        ]
      },
      "Question": {
        "type": "object",
        "properties": {
          "questionId": {
            "type": "string",
            "minLength": 1
          },
          "prompt": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1000
          }
        },
        "required": [
          "questionId",
          "prompt"
        ]
      },
      "Answer": {
        "type": "object",
        "properties": {
          "questionId": {
            "type": "string",
            "minLength": 1
          },
          "answerText": {
            "type": "string",
            "minLength": 1,
            "maxLength": 4000
          }
        },
        "required": [
          "questionId",
          "answerText"
        ],
        "additionalProperties": false
      },
      "OfferTerms": {
        "type": "object",
        "properties": {
          "offerId": {
            "type": "string",
            "format": "uuid"
          },
          "offeredAmount": {
            "type": "string",
            "pattern": "^[0-9]{1,17}\\.[0-9]{2}$",
            "example": "100000.00",
            "description": "Decimal string with exactly two fractional digits; positive for requested/offered amounts and nonnegative for fees."
          },
          "currency": {
            "type": "string",
            "enum": [
              "INR"
            ]
          },
          "annualInterestRatePercent": {
            "type": "string",
            "pattern": "^[0-9]{1,3}(\\.[0-9]{1,4})?$",
            "description": "Decimal string in the inclusive range 0..100."
          },
          "interestRateType": {
            "type": "string",
            "enum": [
              "FIXED"
            ]
          },
          "tenureMonths": {
            "type": "integer",
            "format": "int64",
            "minimum": 1,
            "maximum": 120
          },
          "repaymentFrequency": {
            "type": "string",
            "enum": [
              "MONTHLY"
            ]
          },
          "feesAmount": {
            "type": "string",
            "pattern": "^[0-9]{1,17}\\.[0-9]{2}$",
            "example": "100000.00",
            "description": "Decimal string with exactly two fractional digits; positive for requested/offered amounts and nonnegative for fees."
          },
          "termsReference": {
            "type": "string",
            "minLength": 1,
            "maxLength": 255
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time",
            "description": "Must be in the future when a new command is first persisted; replay retains the original request."
          },
          "version": {
            "type": "integer",
            "format": "int64",
            "minimum": 0,
            "maximum": 0
          }
        },
        "required": [
          "offerId",
          "offeredAmount",
          "currency",
          "annualInterestRatePercent",
          "interestRateType",
          "tenureMonths",
          "repaymentFrequency",
          "feesAmount",
          "termsReference",
          "expiresAt"
        ]
      },
      "DecisionCommand": {
        "type": "object",
        "properties": {
          "decisionId": {
            "type": "string",
            "format": "uuid"
          },
          "decision": {
            "type": "string",
            "enum": [
              "APPROVED",
              "REJECTED",
              "MANUAL_REVIEW",
              "ACTION_REQUIRED"
            ]
          },
          "reasonCode": {
            "type": "string",
            "minLength": 1,
            "description": "Required for REJECTED."
          },
          "informationRequestId": {
            "type": "string",
            "format": "uuid",
            "description": "Required for ACTION_REQUIRED."
          },
          "questions": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Question"
            },
            "minItems": 1,
            "maxItems": 50,
            "description": "Required for ACTION_REQUIRED; unique questionId values."
          },
          "offer": {
            "$ref": "#/components/schemas/OfferTerms"
          },
          "decidedAt": {
            "type": "string",
            "format": "date-time",
            "description": "Integration stamps this once when accepting an officer command; trusted simulator commands and callbacks preserve it."
          },
          "originActor": {
            "$ref": "#/components/schemas/Actor"
          },
          "correlationId": {
            "type": "string",
            "maxLength": 100
          },
          "causationId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "decisionId",
          "decision"
        ],
        "description": "offer is allowed only for APPROVED. ACTION_REQUIRED requires informationRequestId and questions; REJECTED requires reasonCode."
      },
      "InformationRequestCommand": {
        "type": "object",
        "properties": {
          "informationRequestId": {
            "type": "string",
            "format": "uuid"
          },
          "questions": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Question"
            },
            "minItems": 1,
            "maxItems": 50
          },
          "originActor": {
            "$ref": "#/components/schemas/Actor"
          },
          "correlationId": {
            "type": "string",
            "maxLength": 100
          },
          "causationId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
