        "description": "Private lender system client only: lender.callback scope and the configured callback client for the path lender UUID (mock-bank-a or mock-nbfc-b). The path/body lender IDs and stored application, submission, revision, external ID and command origin must match. Duplicate eventId with identical content is accepted; changed content/sequence reuse returns 409. Out-of-order callbacks stay pending until earlier sequence/prerequisites are applied. Retry an early SUBMISSION_NOT_RESERVED_RETRY 409 with the same eventId.",
