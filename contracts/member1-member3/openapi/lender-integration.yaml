          },
          "reasonCode": {
            "type": "string"
          },
          "originActor": {
            "$ref": "#/components/schemas/Actor"
          },
          "correlationId": {
            "type": "string",
            "maxLength": 100
          },
          "causationId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
