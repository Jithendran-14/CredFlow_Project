{
  "openapi": "3.0.3",
  "info": {
    "title": "CredFlow scope completion APIs",
    "version": "1.0.0",
    "description": "Oracle-backed, versioned lender-owned rules and durable seller corrections. Public portal URLs use /api/proxy/eligibility or /api/proxy/application before the service path. Rule reads, history and writes require a human LENDER_OFFICER with a valid signed lenderId; only that lender's products are accessible. Administrators are denied. Queued corrections do not claim distributed synchronous completion."
  },
  "servers": [
    {
      "url": "http://localhost:8081",
      "description": "Application paths"
    },
    {
      "url": "http://localhost:8083",
      "description": "Lender-product paths"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/api/v1/lender-products": {
      "get": {
        "summary": "Lender officer lists current versions for their own lender",
        "responses": {
          "200": {
            "description": "Success"
          },
          "400": {
            "description": "Invalid input"
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Role or scope denied"
          },
          "404": {
            "description": "Resource absent or outside account ownership"
          },
          "409": {
            "description": "Stale version, changed retry or disallowed workflow state"
          }
        }
      }
    },
    "/api/v1/lender-products/{id}/rules": {
      "put": {
        "summary": "Owning lender officer appends immutable rules and routing priority; requires expected version and reason",
        "responses": {
          "200": {
            "description": "Success"
          },
          "400": {
            "description": "Invalid input"
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Role or scope denied"
          },
          "404": {
            "description": "Resource absent or outside account ownership"
          },
          "409": {
            "description": "Stale version, changed retry or disallowed workflow state"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LenderRulesInput"
              }
            }
          }
        }
      }
    },
    "/api/v1/lender-products/{id}/rules/history": {
      "get": {
        "summary": "Owning lender officer reads recorded versions, actor and reason",
        "responses": {
          "200": {
            "description": "Success"
          },
          "400": {
            "description": "Invalid input"
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Role or scope denied"
          },
          "404": {
            "description": "Resource absent or outside account ownership"
          },
          "409": {
            "description": "Stale version, changed retry or disallowed workflow state"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ]
      }
    },
    "/api/v1/applications/{id}/corrections": {
      "get": {
        "summary": "Owning seller, marketplace or administrator reads correction progress",
        "responses": {
          "200": {
            "description": "Success"
          },
          "400": {
            "description": "Invalid input"
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Role or scope denied"
          },
          "404": {
            "description": "Resource absent or outside account ownership"
          },
          "409": {
            "description": "Stale version, changed retry or disallowed workflow state"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ]
      },
      "post": {
        "summary": "Owning seller queues an ACTION_REQUIRED correction before dispatch; keeps snapshots and renews revision checks",
        "responses": {
          "202": {
            "description": "Success"
          },
          "400": {
            "description": "Invalid input"
          },
          "401": {
            "description": "Authentication required"
          },
          "403": {
            "description": "Role or scope denied"
          },
          "404": {
            "description": "Resource absent or outside account ownership"
          },
          "409": {
            "description": "Stale version, changed retry or disallowed workflow state"
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CorrectionInput"
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "LenderRulesInput": {
        "type": "object",
        "required": [
          "productName",
          "reason",
          "minAverageNet",
          "minAmount",
          "maxAmount",
          "maxReturnPercent",
          "salesMultiplier",
          "expectedVersion",
          "minAgeMonths",
          "routingPriority",
          "active",
          "purposes",
          "minCreditScoreBand",
          "maxRepaymentPercent",
          "assessmentAprPercent"
        ],
        "properties": {
          "productName": {
            "type": "string"
          },
          "reason": {
            "type": "string"
          },
          "minAverageNet": {
            "type": "string",
            "pattern": "^[0-9]{1,12}(\\.[0-9]{1,2})?$"
          },
          "minAmount": {
            "type": "string",
            "pattern": "^[0-9]{1,12}(\\.[0-9]{1,2})?$"
          },
          "maxAmount": {
            "type": "string",
            "pattern": "^[0-9]{1,12}(\\.[0-9]{1,2})?$"
          },
          "maxReturnPercent": {
            "type": "string",
            "pattern": "^[0-9]+(\\.[0-9]{1,4})?$"
          },
          "salesMultiplier": {
            "type": "string",
            "pattern": "^[0-9]+(\\.[0-9]{1,4})?$"
          },
          "expectedVersion": {
            "type": "integer",
            "minimum": 1
          },
          "minAgeMonths": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1200
          },
          "routingPriority": {
            "type": "integer",
            "minimum": 0,
            "maximum": 99999
          },
          "active": {
            "type": "boolean"
          },
          "purposes": {
            "type": "array",
            "minItems": 1,
            "maxItems": 3,
            "uniqueItems": true,
            "items": {
              "enum": [
                "WORKING_CAPITAL",
                "PURCHASE_INVENTORY",
                "BUSINESS_EXPANSION"
              ]
            }
          },
          "minCreditScoreBand": {
            "type": "string",
            "enum": [
              "POOR",
              "FAIR",
              "GOOD",
              "EXCELLENT"
            ]
          },
          "maxRepaymentPercent": {
            "type": "string",
            "pattern": "^[0-9]{1,3}(\\.[0-9]{1,4})?$"
          },
          "assessmentAprPercent": {
            "type": "string",
            "pattern": "^[0-9]{1,3}(\\.[0-9]{1,4})?$"
          }
        }
      },
      "CorrectionInput": {
        "type": "object",
        "required": [
          "expectedApplicationRevision",
          "expectedVersion",
          "requestedAmount",
          "loanPurpose",
          "businessProfile"
        ],
        "properties": {
          "expectedApplicationRevision": {
            "type": "integer",
            "minimum": 1
          },
          "expectedVersion": {
            "type": "integer",
            "minimum": 0
          },
          "requestedAmount": {
            "type": "string",
            "pattern": "^[0-9]{1,9}\\.[0-9]{2}$"
          },
          "loanPurpose": {
            "enum": [
              "WORKING_CAPITAL",
              "PURCHASE_INVENTORY",
              "BUSINESS_EXPANSION"
            ]
          },
          "businessProfile": {
            "type": "object",
            "required": [
              "displayName",
              "businessName",
              "businessStartDate"
            ],
            "properties": {
              "displayName": {
                "type": "string",
                "minLength": 1,
                "maxLength": 100
              },
              "businessName": {
                "type": "string",
                "minLength": 1,
                "maxLength": 200
              },
              "businessStartDate": {
                "type": "string",
                "format": "date"
              }
            }
          }
        }
      },
      "CorrectionOperation": {
        "type": "object",
        "properties": {
          "operationId": {
            "type": "string",
            "format": "uuid"
          },
          "applicationId": {
            "type": "string",
            "format": "uuid"
          },
          "previousRevision": {
            "type": "integer",
            "minimum": 0
          },
          "newRevision": {
            "type": "integer",
            "minimum": 0
          },
          "status": {
            "enum": [
              "PENDING",
              "PROCESSING",
              "RETRY_PENDING",
              "APPLIED",
              "REJECTED"
            ]
          },
          "errorCode": {
            "type": "string"
          }
        }
      }
    }
  }
}
