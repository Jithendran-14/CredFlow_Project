spring.config.import=classpath:member3-defaults.properties

server.port=${BANK_A_PORT:8091}
spring.application.name=mock-bank-a
credflow.service-name=mock-bank-a

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=CF_SIM_BANK_A
spring.datasource.password=${CREDFLOW_DB_PASSWORD:}

credflow.default-client-id=mock-bank-a
credflow.default-client-secret=${BANK_A_CALLBACK_SECRET:}

credflow.events.enabled=false

credflow.simulator.bank-code=bank-a
credflow.simulator.lender-id=${BANK_A_LENDER_ID:bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1}
credflow.simulator.integration-client-id=integration-service
credflow.simulator.callback-base=${INTEGRATION_URL:http://localhost:8087}

credflow.oauth.clients.bank-a-callback.client-id=mock-bank-a
credflow.oauth.clients.bank-a-callback.client-secret=${BANK_A_CALLBACK_SECRET:}
