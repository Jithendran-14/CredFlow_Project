spring.config.import=classpath:member3-defaults.properties

server.port=${BANK_C_PORT:8093}
spring.application.name=mock-bank-c
credflow.service-name=mock-bank-c

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=CF_SIM_BANK_C
spring.datasource.password=${CREDFLOW_DB_PASSWORD:}

credflow.default-client-id=mock-bank-c
credflow.default-client-secret=${BANK_C_CALLBACK_SECRET:}

credflow.events.enabled=false

credflow.simulator.bank-code=bank-c
credflow.simulator.lender-id=${BANK_C_LENDER_ID:bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb3}
credflow.simulator.integration-client-id=integration-service
credflow.simulator.callback-base=${INTEGRATION_URL:http://localhost:8087}

credflow.oauth.clients.bank-c-callback.client-id=mock-bank-c
credflow.oauth.clients.bank-c-callback.client-secret=${BANK_C_CALLBACK_SECRET:}
