spring.config.import=classpath:member3-defaults.properties

server.port=${NBFC_B_PORT:8092}
spring.application.name=mock-nbfc-b
credflow.service-name=mock-nbfc-b

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=CF_SIM_NBFC_B
spring.datasource.password=${CREDFLOW_DB_PASSWORD:}

credflow.default-client-id=mock-nbfc-b
