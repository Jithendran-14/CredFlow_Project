credflow.events.enabled=false

credflow.simulator.bank-code=nbfc-b
credflow.simulator.lender-id=${NBFC_B_LENDER_ID:bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb2}
credflow.simulator.integration-client-id=integration-service
credflow.simulator.callback-base=${INTEGRATION_URL:http://localhost:8087}

credflow.oauth.clients.nbfc-b-callback.client-id=mock-nbfc-b
credflow.oauth.clients.nbfc-b-callback.client-secret=${NBFC_B_CALLBACK_SECRET:}
