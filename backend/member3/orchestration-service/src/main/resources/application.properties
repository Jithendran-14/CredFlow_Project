spring.config.import=classpath:member3-defaults.properties

server.port=8084
spring.application.name=orchestration-service
credflow.service-name=orchestration-service

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=CF_ORCHESTRATION
spring.datasource.password=${CREDFLOW_DB_PASSWORD:}

credflow.default-client-id=orchestration-service
credflow.default-client-secret=${ORCHESTRATION_CLIENT_SECRET:}

credflow.clients.application=application-service
credflow.clients.consent=consent-verification-service
credflow.clients.integration=integration-service

credflow.paths.consent-verification-trigger=${CONSENT_VERIFICATION_PATH:/api/v1/internal/verifications}

credflow.topics=financial.consent.granted,financial.consent.withdrawn,financial.consent.expired,application.submitted,application.revised,consent.updated,verification.completed,eligibility.completed,lender.application.submitted,lender.information.requested,lender.information.answered,lender.decision.received,loan.offer.created,loan.offer.withdrawn,loan.offer.acknowledged,lender.cancellation.acknowledged,lender.processing.failed,lender.processing.recovered
