spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=NUMERIC

spring.flyway.enabled=false

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

credflow.security.issuer=${AUTH_ISSUER}
credflow.security.jwk-set-uri=${JWT_JWKS_URI:}
credflow.security.public-key-location=${JWT_PUBLIC_KEY_LOCATION:}
credflow.security.role-mode=${JWT_ROLE_MODE:FLAT}
credflow.security.role-claim=${JWT_ROLE_CLAIM:roles}

# Member 1's custom Auth has no agreed machine-token endpoint yet.
# Set an explicitly agreed client-credentials URL; never infer a login route.
credflow.oauth.token-url=${OAUTH_TOKEN_URL:}
credflow.oauth.clients.system.client-id=${credflow.default-client-id}
credflow.oauth.clients.system.client-secret=${credflow.default-client-secret}

credflow.security.audience=${JWT_AUDIENCE:${credflow.service-name}}
credflow.security.roles-client=${UI_CLIENT_ID:credflow-ui}
credflow.frontend-origins=${FRONTEND_ORIGINS:http://localhost:5173}

credflow.urls.application=${APPLICATION_URL:http://localhost:8081}
credflow.urls.consent=${CONSENT_URL:http://localhost:8082}
credflow.urls.eligibility=${ELIGIBILITY_URL:http://localhost:8083}
credflow.urls.orchestration=${ORCHESTRATION_URL:http://localhost:8084}
credflow.urls.integration=${INTEGRATION_URL:http://localhost:8087}
credflow.urls.bank-a=${BANK_A_URL:http://localhost:8091}
credflow.urls.nbfc-b=${NBFC_B_URL:http://localhost:8092}

credflow.lenders.bank-a-id=${BANK_A_LENDER_ID:bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb1}
credflow.lenders.nbfc-b-id=${NBFC_B_LENDER_ID:bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbb2}

# DeliveryEngine defaults to enabled through @ConditionalOnProperty.
# Keep the switch out of this imported file so the simulator can disable it.
credflow.delivery.max-attempts=20

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.listener.ack-mode=record

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.request.timeout.ms=8000
spring.kafka.producer.properties.delivery.timeout.ms=12000
spring.kafka.producer.properties.max.block.ms=5000

logging.structured.format.console=logstash

management.endpoints.web.exposure.include=health
server.error.include-message=never
