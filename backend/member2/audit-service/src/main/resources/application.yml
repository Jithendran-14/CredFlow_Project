server:
  port: ${SERVER_PORT:8086}
spring:
  application:
    name: audit-service
  datasource:
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: CF_AUDIT
    password: ${CF_AUDIT_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: audit-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
credflow:
  audit:
    topics: financial.consent.granted,financial.consent.withdrawn,financial.consent.expired,verification.completed,application.submitted,application.revised,application.status.changed,consent.applied,eligibility.completed,lender.application.submitted,lender.cancellation.acknowledged,lender.decision.received,lender.information.answered,lender.information.requested,lender.information.response.recorded,lender.processing.failed,lender.processing.recovered,loan.offer.accepted,loan.offer.acknowledged,loan.offer.created,loan.offer.declined,loan.offer.expired,loan.offer.withdrawn
  security:
    issuer: ${JWT_ISSUER:credflow-auth}
    audience: ${JWT_AUDIENCE:credflow-api}
    public-key-location: ${JWT_PUBLIC_KEY_PATH:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
logging:
  structured:
    format:
      console: logstash
