server:
  port: ${SERVER_PORT:8090}
spring:
  application:
    name: mock-external-systems
  datasource:
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${FINANCIAL_MOCK_DB_USER:CF_SIM_FINANCIAL}
    password: ${CF_SIM_FINANCIAL_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
credflow:
  security:
    issuer: ${JWT_ISSUER:credflow-auth}
    audience: ${JWT_AUDIENCE:credflow-api}
    public-key-location: ${JWT_PUBLIC_KEY_PATH:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
logging:
  structured:
    format:
      console: logstash
